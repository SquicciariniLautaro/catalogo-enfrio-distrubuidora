<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo - EnFrío Distribuidora</title>
    
    <!-- CSS Bootstrap y Poppins (Local) -->
    <link rel="stylesheet" href="node_modules/bootstrap/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="node_modules/@fontsource/poppins/index.css">
    
    <!-- CSS Personalizado CORREGIDO (ruta directa a la raíz) -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Barra de Navegación -->
    <nav class="navbar navbar-expand-lg bg-body-tertiary shadow-sm" id="navbar">
        <div class="container d-flex justify-content-between align-items-center">
            <a class="navbar-brand" href="#">
                <!-- Logos con los nombres nuevos sin espacios -->
                <img src="img/logo-negro.png" alt="EnFrío Distribuidora" id="logo-principal" height="40">
            </a>
            
            <div class="form-check form-switch">
                <input class="form-check-input" type="checkbox" role="switch" id="switch-modo-oscuro">
                <label class="form-check-label" for="switch-modo-oscuro" id="texto-modo">Modo Oscuro</label>
            </div>
        </div>
    </nav>

    <!-- Contenedor Principal -->
    <div class="container mt-5 mb-5 pb-5">
        <div class="row mb-4">
            <div class="col">
                <h2 class="fw-bold" id="titulo-principal">Nuestro Catálogo</h2>
                <!-- Buscador -->
<div class="row mb-4">
    <div class="col-md-8 mx-auto">
        <input type="text" id="buscador" class="form-control form-control-lg shadow-sm border-0" placeholder="Buscar por nombre o categoría (ej. Pan, Merluza, Sin Gluten...)">
    </div>
</div>
                <p class="text-muted" id="subtitulo-principal">Selecciona los productos que te interesan para consultar.</p>
            </div>
        </div>
        
        <!-- Spinner de Carga -->
        <div id="pantalla-carga" class="text-center my-5">
            <div class="spinner-border text-primary" role="status" style="width: 3rem; height: 3rem;">
                <span class="visually-hidden">Cargando...</span>
            </div>
            <h5 class="mt-3 text-muted">Cargando catálogo...</h5>
        </div>

        <!-- Cuadrícula de Productos -->
        <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4" id="contenedor-productos">
            <!-- Se inyecta con JS -->
        </div>
    </div>

    <!-- Botón Flotante del Carrito -->
    <div id="contenedor-carrito" class="position-fixed bottom-0 end-0 p-3" style="display: none; z-index: 1050;">
        <button id="btn-enviar-whatsapp" class="btn btn-success btn-lg shadow rounded-pill px-4 d-flex align-items-center gap-2">
            <span id="contador-carrito" class="badge bg-light text-success rounded-circle">0</span>
            Enviar Consulta
        </button>
    </div>

    <script src="node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
